name: Portal admin (rules, coaches, password resets)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'tools/portal-admin.mjs'
      - 'tools/deploy-rules.mjs'
      - 'database.rules.json'
      - 'tools/deploy-db.mjs'
      - '.github/workflows/portal-admin.yml'
concurrency: portal-admin
jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secret
        id: s
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: if [ -n "$SA" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "Service account secret not added yet"; fi
      - name: Install
        if: steps.s.outputs.ok == '1'
        run: npm i --no-save firebase-admin@13 firebase-tools@15 nodemailer@6
      - name: Create the Firestore database if it does not exist (asia-south1, Mumbai)
        if: steps.s.outputs.ok == '1' && github.event_name != 'schedule'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          if npx firebase firestore:databases:get "(default)" --project purple-queen-38407 >/dev/null 2>&1; then
            echo "Database already exists"
          else
            npx firebase firestore:databases:create "(default)" --location asia-south1 --project purple-queen-38407 || echo "::warning::Could not create the database automatically"
          fi
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Publish Firestore rules
        if: steps.s.outputs.ok == '1' && github.event_name != 'schedule'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/deploy-rules.mjs
      - name: Coaches and queued requests
        if: steps.s.outputs.ok == '1'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          COACH_EMAILS: ${{ secrets.COACH_EMAILS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node tools/portal-admin.mjs
      - name: Realtime Database for live games (create, rules, staff)
        if: steps.s.outputs.ok == '1'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/deploy-db.mjs ${{ github.event_name != 'schedule' && '--rules' || '' }}
